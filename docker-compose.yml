services:
  deeperseeker:
    build:
      context: .
      args:
        # 仅用于构建时下载 Debian 包，不影响容器运行时网络。
        DEBIAN_MIRROR: ${BUILD_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${BUILD_DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    container_name: deeperseeker
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    volumes:
      - deeperseeker_data:/app/data
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  deeperseeker_data:
